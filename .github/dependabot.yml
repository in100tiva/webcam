version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      electron:
        patterns:
          - "electron"
          - "electron-builder"
      react:
        patterns:
          - "react*"
          - "@radix-ui/*"
          - "lucide-react"
    ignore:
      # Major de dependência neste app costuma exigir migração de código
      # (Electron, Vite, React, Radix). Atualizamos manualmente, testando o app.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/mobile-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps-android)"
    ignore:
      # salto de versão maior do Capacitor muda o projeto Android inteiro
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # as actions estão presas por SHA; subir major sem revisar o workflow quebra o CI
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
