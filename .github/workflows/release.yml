name: Build & Release Installers

# Builda os instaladores e anexa ao GitHub Release da tag.
# Windows roda em runner nativo (não precisa de Wine).
# Actions fixadas por SHA (commit) — só sobem com PR explícito do Dependabot.
#
# Uso: crie e envie uma tag, ex.:
#   git tag v2.0.2 && git push origin v2.0.2
# Isso dispara o build e publica
# PhoneWebcam-{linux.deb,linux.AppImage,windows.exe,android.apk}.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build .deb + AppImage
        run: npx electron-builder --linux deb AppImage --publish never
      - name: Renomear artefatos
        run: |
          mkdir -p out
          cp dist/*.deb "out/PhoneWebcam-linux.deb"
          cp dist/*.AppImage "out/PhoneWebcam-linux.AppImage"
      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build .exe (NSIS, nativo — sem Wine)
        run: npx electron-builder --win nsis --publish never
      - name: Renomear artefato
        shell: bash
        run: |
          mkdir -p out
          cp dist/*.exe "out/PhoneWebcam-windows.exe"
      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/PhoneWebcam-windows.exe

  android:
    runs-on: ubuntu-latest
    # APK é o único artefato que depende do toolchain Android do runner.
    # Se ele quebrar, o release de Linux/Windows continua publicando.
    continue-on-error: true
    permissions:
      contents: write
    env:
      # O runner ubuntu-latest já vem com o Android SDK; não usamos
      # android-actions/setup-android (baixava cmdline-tools e falhava no CI).
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: mobile-app
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renomear artefato
        run: |
          mkdir -p out
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk "out/PhoneWebcam-android.apk"
      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/PhoneWebcam-android.apk
