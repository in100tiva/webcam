name: CI

# Garante que o app compila (Vite) em todo push/PR na main.
# Não roda os instaladores: para gerar .deb/.exe/.apk use uma tag v* (release.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar app (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Checar sintaxe do processo principal (Node)
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/virtualcam/index.js
      - name: Build do renderer (Vite)
        run: npm run build:vite
      - name: Conferir os arquivos publicados
        run: |
          test -f dist-react/index.html
          du -sh dist-react
