<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Webcam - Clean Output</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoPreview {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .no-video {
      color: #666;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }

    .no-video p {
      font-size: 1.2rem;
    }

    .hint {
      font-size: 0.9rem;
      margin-top: 10px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="videoPreview" style="display: none;" alt="Video">
    <div class="no-video" id="noVideo">
      <p>Aguardando video...</p>
      <p class="hint">Conecte o celular no app principal</p>
    </div>
  </div>

  <script>
    const videoPreview = document.getElementById('videoPreview');
    const noVideo = document.getElementById('noVideo');

    // Handle incoming video frames
    window.electronAPI.onVideoFrame((frameData) => {
      videoPreview.src = `data:image/jpeg;base64,${frameData}`;

      if (videoPreview.style.display === 'none') {
        videoPreview.style.display = 'block';
        noVideo.style.display = 'none';
      }
    });
  </script>
</body>
</html>
